name: Changelog

# Adds one line to CHANGELOG.MD for every pull request merged into main, written
# from the standpoint of someone using the app rather than as the pull request
# title, then commits it back to main.
#
# Never runs on prod: if a bot wrote the file on both branches they would diverge
# and every main -> prod merge would conflict on it. prod gets the file the
# ordinary way, by merging main.
#
# CHANGELOG.MD starts straight at a month heading with no title above it. The
# step below reads its first line to decide whether this month already has a
# heading, so a title there would give every merge its own duplicate heading.

# pull_request_target, not pull_request, so a merged pull request opened from
# someone else's fork gets its line too. On pull_request, GitHub runs the copy of
# this file from the pull request itself and hands the run no secrets, so the
# push at the end has nothing to push with. pull_request_target runs the copy
# already on main, which nobody outside can change, so the secrets are there.
# That is only safe because the checkout below takes main and this job never runs
# the pull request's code.
on:
  pull_request_target:
    types: [closed]
    branches: [main]

# Two merges landing at once would both push to main and one would be rejected.
# Queue them instead.
concurrency: changelog

jobs:
  append:
    # Anyone who forks this repo gets a copy of this file. The repository check
    # keeps it from writing to their changelog and pushing to their main.
    #
    # The merged check matters more here than it looks: closed also fires when
    # someone closes a pull request without merging it, which anyone can do to
    # their own at any time.
    if: github.event.pull_request.merged && github.repository == 'ARTPARK-SAHAI-ORG/calibrate-frontend'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          # The merged commit is needed by name below, so shallow will not do.
          fetch-depth: 0
          # main is protected: every change must come through a pull request, and
          # only a repository admin is allowed past that. The token a workflow
          # gets by default is not, and GitHub will not let the Actions bot be
          # added to the bypass list, so the push at the end has to be made with
          # an admin's own token. CHANGELOG_TOKEN is a personal access token
          # scoped to this repository with permission to write files.
          token: ${{ secrets.CHANGELOG_TOKEN }}

      - name: Collect what the pull request did
        env:
          # Read through the environment, not ${{ }} inside the script: a title
          # and body are written by whoever opened the pull request and would
          # otherwise be pasted straight into the shell.
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          {
            printf 'Title: %s\n\nDescription:\n%s\n\nFiles changed:\n' "$TITLE" "$BODY"
            git show --stat --format= "$SHA" || true
          } > pr.md

      - name: Write the entry
        # Kept going so a failure here loses the wording, never the entry: the
        # step below falls back to the pull request title. The last step in the
        # job then fails the run, so a silent fallback cannot go unnoticed.
        continue-on-error: true
        id: entry
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowed-tools "Read,Write"'
          prompt: |
            Read pr.md. It describes one pull request that just merged into
            Calibrate, a web app where nonprofit teams test and evaluate voice AI
            agents. Write ONE sentence saying what a person using the app can now
            do, or what stopped going wrong, and put that sentence alone in
            entry.txt.

            First decide whether there is anything to say at all. Some pull
            requests change nothing a person using Calibrate can see: a fix to a
            test, a change to how the code is built or checked, a change to one of
            these workflow files, notes for developers. If this is one of those,
            write exactly SKIP to entry.txt and nothing else. The changelog then
            gets no line for it. Only do this when you are sure: when in doubt,
            write the sentence.

            Rules for the sentence:
            - Say what changed for the person using the app, not what the code does.
            - Plain everyday words. No technical vocabulary at all: no hook,
              endpoint, component, state, cache, poll, payload, refactor, API,
              backend, frontend, render, route, query, parameter, pagination.
            - No machine learning or statistics words: no inference, ground truth,
              precision, recall, aggregation, distribution, threshold.
            - Use the app's own words: agent, test, test run, evaluator, annotator,
              labelling task, item, score, benchmark, trace, workspace, persona,
              scenario, simulation.
            - One sentence, sentence case, no full stop at the end, no em-dashes,
              expanded contractions (does not, cannot), no marketing words.
            - Do not invent anything the pull request does not show.

            Write nothing but that sentence to entry.txt. No heading, no dash, no
            pull request number, no quotes.

      - name: Add it to the changelog
        id: append
        env:
          TITLE: ${{ github.event.pull_request.title }}
          NUMBER: ${{ github.event.pull_request.number }}
          URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Fall back to the pull request title if the step above could not write
          # a sentence, so a failure there loses the wording, never the entry.
          LINE=$(head -1 entry.txt 2>/dev/null | sed -E 's/^[-*] *//; s/ *$//')
          [ -n "$LINE" ] || LINE=$(printf '%s' "$TITLE" | sed -E 's/ *\(#[0-9]+\) *$//')

          # SKIP means the step above read the pull request and found nothing a
          # person using the app can see. It is a word it writes on purpose, not
          # an empty file, so a failure there still falls back to the title above
          # rather than being mistaken for this.
          if [ "$LINE" = "SKIP" ]; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            echo "Nothing a person using the app can see. No changelog line."
            rm -f pr.md entry.txt
            exit 0
          fi
          ENTRY="- ${LINE} ([#${NUMBER}](${URL}))"
          MONTH=$(date -u +'%B %Y')

          # Newest first, under a heading for the month. Written with cat rather
          # than sed so it also works on an empty file.
          if head -1 CHANGELOG.MD | grep -qxF "## $MONTH"; then
            { head -2 CHANGELOG.MD; printf '%s\n' "$ENTRY"; tail -n +3 CHANGELOG.MD; } > CHANGELOG.new
          else
            { printf '## %s\n\n%s\n\n' "$MONTH" "$ENTRY"; cat CHANGELOG.MD; } > CHANGELOG.new
          fi
          mv CHANGELOG.new CHANGELOG.MD
          rm -f pr.md entry.txt

      - name: Commit to main
        if: steps.append.outputs.skipped != 'true'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # [skip ci] keeps this commit from re-running the whole test suite,
          # which tests.yml would otherwise do on every push to main.
          git commit -m "changelog: #${NUMBER} [skip ci]" -- CHANGELOG.MD
          # No rebase or retry: main only moves through merged pull requests, and
          # the concurrency group above already keeps two of those from writing
          # this file at once. A rejected push here means someone pushed straight
          # to main, which should fail loudly rather than be worked around.
          git push

      # The changelog is already written and pushed by this point, so failing
      # here costs nothing and is the only thing that makes a broken Claude step
      # visible. Without it the run is green while every entry silently falls
      # back to the pull request title.
      - name: Fail if the entry could not be written
        if: steps.entry.outcome == 'failure'
        run: |
          echo "::error::Claude could not write the changelog line, so the pull request title was used instead. The entry landed; the wording did not."
          exit 1
